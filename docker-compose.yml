
services:
  postgres:
    image: postgres:16
    container_name: authforge-postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: authforge
      POSTGRES_USER: authforge_user
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-local_dev_password_change_me}
    ports:
      - "5433:5432"
    volumes:
      - authforge_postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U authforge_user -d authforge"]
      interval: 5s
      timeout: 5s
      retries: 5

volumes:
  authforge_postgres_data:
